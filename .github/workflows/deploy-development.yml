name: Validate Development Branch

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build:dev
        env:
          VITE_API_URL: ${{ vars.VITE_API_DEVELOPMENT_URL }}
          VITE_API_DEVELOPMENT_URL: ${{ vars.VITE_API_DEVELOPMENT_URL }}
          VITE_ENV: development
          VITE_GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
